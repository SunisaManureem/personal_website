<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Game — Sunisa Portfolio</title>
  <meta name="description" content="เกมจับคู่การ์ด — ฝึกความจำ">
  <link rel="stylesheet" href="css/style.css">
  <style>
  </style>
</head>
<body>

<!-- ============================================================
     LAYER 1 — HTML: Semantic Foundation
     เนื้อหาและโครงสร้างทำงานได้โดยไม่ต้องมี CSS หรือ JS
============================================================ -->

<nav class="nav" role="navigation" aria-label="site navigation">
  <a href="index.html">← Back to Portfolio</a>
  <span class="nav-title">memory.</span>
  <button class="theme-btn" id="themeBtn" aria-label="Toggle dark/light mode">◑</button>
</nav>

<!-- LAYER 1: noscript fallback — แสดงเฉพาะเมื่อ JS ปิด -->
<noscript>
  <div id="nojs-notice" style="display:block; padding:1rem 1.5rem; background:#fef3cd; color:#6b5a00; font-family:monospace; font-size:.85rem; border-bottom:2px solid #f0c040;">
    ⚠️ JavaScript ถูกปิด — เกมจำเป็นต้องใช้ JS เพื่อพลิกการ์ด
    แต่คุณยังดูรายการ emoji ทั้งหมดด้านล่างได้
  </div>
</noscript>

<main class="wrapper" id="main">
  <h1>Memory <em>Game</em></h1>

  <!-- Stats — อัปเดตผ่าน JS, ค่าเริ่มต้นเขียนใน HTML เลย -->
  <div class="stats" role="status" aria-live="polite">

  <div class="stat-card">
    <div class="icon">✨</div>
    <div class="value" id="stat-moves">0</div>
    <div class="label">MOVES</div>
  </div>

  <div class="stat-card">
    <div class="icon">📚</div>
    <div class="value" id="stat-pairs">0</div>
    <div class="label">PAIRS</div>
  </div>

  <div class="stat-card">
    <div class="icon">⏱</div>
    <div class="value" id="stat-time">0</div>
    <div class="label">TIME</div>
  </div>

  <div class="stat-card">
    <div class="icon">🏆</div>
    <div class="value" id="stat-best">—</div>
    <div class="label">BEST</div>
  </div>

</div>

  <!-- Timer bar (visual only) -->
  <div id="timer-bar-wrap" aria-hidden="true"><div id="timer-bar"></div></div>

  <!-- Controls -->
  <div class="controls" role="group" aria-label="difficulty">
    <button class="btn active" data-size="4" aria-pressed="true">4×4</button>
    <button class="btn" data-size="3" aria-pressed="false">3×4</button>
    <button class="btn" data-size="2" aria-pressed="false">2×4</button>
    <button class="btn btn-restart" id="restartBtn" aria-label="Restart game">↺ Restart</button>
  </div>

  <!-- Board: JS จะ inject การ์ด, fallback ถ้าไม่มี JS คือ list ด้านล่าง -->
  <div id="board" class="grid-4" role="grid" aria-label="memory card board"></div>

  <!-- LAYER 1 fallback list — เขียนใน HTML ตรงๆ เพื่อให้ No-JS เห็นได้จริง
       JS จะซ่อน div นี้เมื่อโหลดสำเร็จ -->
  <div id="fallback-list" style="margin-top:1.5rem;">
    <h2 style="font-size:1rem; margin-bottom:.5rem;">รายการ emoji ทั้งหมด (no-JS mode)</h2>
    <p style="font-size:.8rem; color:gray; margin-bottom:.8rem;">เมื่อ JS ทำงาน รายการนี้จะถูกซ่อนและแสดงเป็นบอร์ดเกมแทน</p>
    <div style="display:flex; flex-wrap:wrap; gap:.6rem; font-size:2rem; line-height:1;">
      <span title="Cat">🐱</span>
      <span title="Dog">🐶</span>
      <span title="Fox">🦊</span>
      <span title="Frog">🐸</span>
      <span title="Penguin">🐧</span>
      <span title="Lion">🦁</span>
      <span title="Bear">🐻</span>
      <span title="Butterfly">🦋</span>
      <span title="Blossom">🌸</span>
      <span title="Pizza">🍕</span>
      <span title="Guitar">🎸</span>
      <span title="Rocket">🚀</span>
      <span title="Target">🎯</span>
      <span title="Rainbow">🌈</span>
      <span title="Lightning">⚡</span>
      <span title="Donut">🍩</span>
      <span title="Circus">🎪</span>
      <span title="Unicorn">🦄</span>
      <span title="Cactus">🌵</span>
      <span title="Theater">🎭</span>
      <span title="Puzzle">🧩</span>
      <span title="Dice">🎲</span>
      <span title="Crystal ball">🔮</span>
      <span title="Balloon">🎈</span>
    </div>
  </div>

  <!-- Win message -->
  <div id="win-msg" role="alert" aria-live="assertive">
    <h2 id="win-title">🎉 ชนะแล้ว!</h2>
    <p id="win-detail"></p>
    <br>
    <button class="btn btn-restart" id="winRestartBtn">เล่นอีกรอบ</button>
  </div>
</main>
<script src="js/game.js"></script>
</body>
</html>
